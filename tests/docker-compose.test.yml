# Stack for `make test` and the CI image tests: the production image built from this
# checkout, with throwaway Postgres, memcached and Solr. No fixed host port and nothing
# mounted from var/, so it can run next to the dev instance.
services:
  instance:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
      solr:
        condition: service_started
    environment:
      - ENV=dev
      - MEMCACHE_SERVER=memcached
      - MEMCACHE_DEFAULT_AGE=10800
      - RELSTORAGE_HOSTNAME=postgres
      - RELSTORAGE_PORT=5432
      - RELSTORAGE_DB=directory_test
      - RELSTORAGE_USER=directory_test
      - RELSTORAGE_PASSWORD=directory_test
      - ZODB_CACHE_SIZE=30000
      - ZEO_CLIENT_CACHE_SIZE=256MB
      - PROJECT_ID=directory-test
      - ACTIVE_BIGBANG=True
      - PLONE_EXTENSION_IDS=plone.app.caching:default,plonetheme.barceloneta:default,imio.directory.policy:default
      - DEFAULT_LANGUAGE=fr
      - ADMIN_PASSWORD=admin
      - COLLECTIVE_SOLR_HOST=solr
      - COLLECTIVE_SOLR_PORT=8983
      - COLLECTIVE_SOLR_BASE=/solr/directory
      - COLLECTIVE_SOLR_LOGIN=solr
      - COLLECTIVE_SOLR_PASSWORD=SolrRocks
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::8081"
    healthcheck:
      # big.bang creates the site before Zope serves, which takes longer than the
      # Dockerfile healthcheck allows.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ok | grep -q OK"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 300s
  postgres:
    image: postgres:17.6
    environment:
      - POSTGRES_DB=directory_test
      - POSTGRES_USER=directory_test
      - POSTGRES_PASSWORD=directory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory_test -d directory_test"]
      interval: 2s
      retries: 30
  memcached:
    image: memcached:1.5.20
  solr:
    image: solr:9.6.1-slim
    # imio.directory.policy turns collective.solr on, so the site needs a `directory` core.
    # Its schema lives in buildout.smartweb, which runs the Solr of every SmartWeb
    # application: fetch it from there instead of keeping a copy here.
    # Switch the branch to main once plone62 is merged into main.
    environment:
      - SOLR_CONF_URL=https://raw.githubusercontent.com/IMIO/buildout.smartweb/refs/heads/plone62/solr/plone/directory/conf
    command:
      - bash
      - -ec
      - |
        mkdir -p /tmp/directory/conf
        for file in schema.xml solrconfig.xml stopwords.txt synonyms.txt mapping-FoldToASCII.txt; do
          curl -fsS -o "/tmp/directory/conf/$$file" "$$SOLR_CONF_URL/$$file"
        done
        exec solr-precreate directory /tmp/directory
